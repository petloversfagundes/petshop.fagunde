<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pet Shop | Pedido</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f5f5;font-family:Arial,sans-serif;color:#222;padding-bottom:100px}
.container{max-width:700px;margin:auto;padding:20px}
h1{text-align:center;margin-bottom:5px}
.subtitulo{text-align:center;color:#666;margin:0 0 15px}
.abas{display:flex;gap:8px;margin-bottom:15px}
.abas button{flex:1;padding:12px;border:none;border-radius:10px;background:#e4e4e4;font-size:16px;font-weight:bold;cursor:pointer}
.abas button.on{background:#0b4f5c;color:#fff}
.filtros{display:flex;gap:8px;margin-bottom:15px}
.produtos{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.produto,.card{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card{padding:16px;margin-bottom:12px}
.foto{position:relative;width:100%;aspect-ratio:1/1;background:#e9e9e9;display:flex;align-items:center;justify-content:center;overflow:hidden}
.foto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sem-foto{font-size:44px}
.info{padding:12px}
.nome{font-weight:bold;font-size:16px}
.descricao{color:#777;font-size:13px;margin-top:4px;min-height:1em}
.preco{font-weight:bold;font-size:18px;margin:8px 0}
.quantidade{display:flex;align-items:center;justify-content:space-between}
.quantidade button{width:38px;height:38px;border:none;border-radius:50%;background:#0b4f5c;color:#fff;font-size:22px;cursor:pointer}
.quantidade span{font-weight:bold;font-size:18px}
.formulario{background:#fff;margin-top:25px;padding:20px;border-radius:15px}
.formulario h2,.card h2{margin-top:0}
label{display:block;font-weight:bold;margin-top:15px;margin-bottom:5px}
input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px;font-size:16px;background:#fff;font-family:inherit}
.opcoes{display:flex;gap:10px;flex-wrap:wrap}
.opcao{flex:1;min-width:120px;padding:12px;background:#f3f3f3;border-radius:8px;cursor:pointer;margin:0}
.opcao input{width:auto}
.esconder{display:none!important}
.pix-info{margin-top:15px;padding:15px;background:#eef9f1;border:1px solid #b8dfc2;border-radius:10px}
.pix-chave{word-break:break-all;font-weight:bold;color:#08752b}
.resumo{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;padding:12px;z-index:100}
.resumo-interno{max-width:700px;margin:auto;display:flex;align-items:center;gap:15px}
.total{flex:1}.total small{display:block;color:#777}.total strong{font-size:20px}
.whatsapp,.btn{background:#25D366;color:#063b1c;border:none;border-radius:10px;padding:14px 18px;font-size:16px;font-weight:bold;cursor:pointer}
.btn.azul{background:#0b4f5c;color:#fff}.btn.red{background:#c62828;color:#fff}.btn.amarelo{background:#f2a93b;color:#222}
.whatsapp:disabled{opacity:.5;cursor:not-allowed}
.erro{color:#c62828;margin-top:12px;font-weight:bold}
.serv{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
.rodape{text-align:center;margin-top:30px;font-size:13px}.rodape a{color:#888}
.ap{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.th{width:70px;height:70px;flex:none;background:#e9e9e9;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:26px}
.th img{width:100%;height:100%;object-fit:cover}
.af{flex:1;display:grid;gap:6px;min-width:0}.af input,.af select{padding:8px;font-size:14px}
.row2{display:flex;gap:6px}
.pubbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
@media(max-width:500px){.produtos{gap:10px}.container{padding:12px}.info{padding:9px}.nome{font-size:14px}.preco{font-size:16px}.whatsapp{padding:12px;font-size:14px}}
</style>
</head>
<body>
<div class="container">
<h1 id="nomeLoja">Pet Shop</h1>
<p class="subtitulo" id="sub">Escolha os produtos e faça seu pedido pelo WhatsApp 🐾</p>
<div class="abas"><button data-a="loja" class="on">Produtos</button><button data-a="banho">Banho e tosa</button></div>

<div id="loja">
 <div class="filtros"><input id="busca" placeholder="Buscar produto..."><select id="cat"></select></div>
 <div class="produtos" id="produtos"></div>
 <div class="formulario">
  <h2>Seus dados</h2>
  <label>Nome</label><input id="nome" placeholder="Pet shop Fagundes">
  <label>WhatsApp</label><input id="telefone" type="tel" placeholder="(11) 91360-2325">
  <label>Como deseja receber?</label>
  <div class="opcoes"><label class="opcao"><input type="radio" name="recebimento" value="Entrega" checked> 🚚 Entrega</label><label class="opcao"><input type="radio" name="recebimento" value="Retirada"> 🏪 Retirar na loja</label></div>
  <div id="enderecoArea"><label>Endereço</label><input id="endereco" placeholder="Rua, número e bairro"></div>
  <label>Forma de pagamento</label>
  <div class="opcoes"><label class="opcao"><input type="radio" name="pagamento" value="Pix" checked> 💚 Pix</label><label class="opcao"><input type="radio" name="pagamento" value="Cartão"> 💳 Cartão</label><label class="opcao"><input type="radio" name="pagamento" value="Dinheiro"> 💵 Dinheiro</label></div>
  <div id="pixArea" class="pix-info"><strong>💚 Pagamento via Pix</strong><br>Chave Pix:<div class="pix-chave" id="pixChave"></div><small>Após fazer o Pix, envie o comprovante pelo WhatsApp.</small></div>
  <div id="trocoArea" class="esconder"><label>Troco para quanto?</label><input id="troco" type="number" min="0" step="0.01" placeholder="Ex.: 100"></div>
  <div class="erro" id="erro"></div>
 </div>
</div>

<div id="banho" class="esconder">
 <div class="card"><h2>Nossos serviços</h2><div id="servicos"></div></div>
 <div class="card"><h2>Agendar pelo WhatsApp</h2>
  <label>Seu nome</label><input id="bN"><label>Nome do pet</label><input id="bP"><label>Raça e porte</label><input id="bR">
  <label>Serviço</label><select id="bS"></select><label>Data</label><input id="bD" type="date"><label>Horário</label><input id="bH" type="time">
  <div class="erro" id="bErro"></div><p><button class="btn" id="bSend">Agendar no WhatsApp</button></p></div>
</div>

<div id="admin" class="esconder"></div>
<p class="rodape"><a href="#" id="abrirAdmin">Área do lojista</a></p>
</div>

<div class="resumo" id="barra"><div class="resumo-interno"><div class="total"><small id="qtdTotal">0 itens</small><strong id="valorTotal">R$ 0,00</strong></div><button class="whatsapp" id="enviar" disabled>Enviar no WhatsApp</button></div></div>

<script>
const CATS=[
["Rações e alimentos","Ração para cães adultos|Ração para filhotes de cachorro|Ração para cães idosos|Ração para cães de pequeno porte|Ração para cães de grande porte|Ração para gatos adultos|Ração para filhotes de gato|Ração para gatos castrados|Ração para gatos idosos|Ração úmida para cães|Ração úmida para gatos|Sachê para gatos|Sachê para cães|Leite substituto para filhotes|Alimentação para coelhos|Ração para hamsters|Ração para pássaros|Alimento para peixes ornamentais"],
["Petiscos","Bifinhos para cães|Biscoitos para cães|Petiscos para gatos|Petiscos cremosos para gatos|Ossinhos mastigáveis próprios para cães|Snacks para saúde bucal|Petiscos naturais para cães|Petiscos para treinamento|Palitos mastigáveis|Molho para ração|Snacks para coelhos|Petiscos para roedores"],
["Higiene e limpeza","Tapete higiênico para cães|Fraldas para cães|Lenços umedecidos para pets|Shampoo para cães|Shampoo para gatos|Condicionador para pets|Shampoo a seco para pets|Sabonete para pets|Colônia para cães|Eliminador de odores|Desinfetante próprio para ambientes com animais|Areia higiênica para gatos|Sílica para gatos|Pá para recolher areia|Saco coletor de fezes|Educador sanitário para pets|Limpador de patas|Escova dental para pets"],
["Acessórios","Coleira para cães|Coleira para gatos|Guia para passeio|Guia retrátil|Peitoral para cães|Peitoral para gatos|Identificador de coleira|Comedouro de plástico|Comedouro de inox|Comedouro lento|Bebedouro para pets|Bebedouro portátil|Garrafa de água para passeio|Porta-sachê|Porta-sacos para fezes|Cinto de segurança para pets|Grade de proteção para ambientes|Portão de segurança para pets"],
["Brinquedos","Bolinha para cães|Corda para cães|Mordedor para cães|Brinquedo de pelúcia|Brinquedo interativo|Brinquedo dispensador de petiscos|Túnel para gatos|Ratinho de brinquedo para gatos|Varinha com penas para gatos|Bolinha com guizo|Arranhador para gatos|Circuito de brinquedo para gatos"],
["Camas e transporte","Caminha para cães|Caminha para gatos|Colchonete para pets|Almofada para pets|Cobertor para animais|Casinha para cães|Toca para gatos|Caixa de transporte para cães|Caixa de transporte para gatos|Bolsa de transporte para pets|Mochila de transporte para animais|Capa protetora para banco de carro"],
["Escovação e cuidados","Escova para pelos|Rasqueadeira|Pente para pets|Luva removedora de pelos|Cortador de unhas para pets|Lixa de unhas para pets|Tesoura de tosa|Máquina de tosa|Toalha para pets|Secador próprio para pets|Escova removedora de pelos de roupas|Tapete coletor de areia para gatos"],
["Roupas e outros animais","Roupa para cães|Capa de chuva para cães|Bandana para pets|Sapatinhos para cães|Gaiola para hamsters|Enfeites para aquário"]];
const ICON=["🍖","🦴","🧼","🦮","🎾","🛏️","🪮","👕"];
const DEF=()=>{let id=0,p=[];CATS.forEach(([c,l])=>l.split("|").forEach(n=>p.push({id:++id,n,d:"",p:0,c,f:""})));
return{cfg:{loja:"Meu Pet Shop",whats:"5511999999999",pix:"11999999999",pixNome:"Meu Pet Shop",taxa:8,end:"",hor:""},
serv:[{n:"Banho - porte pequeno",p:40},{n:"Banho - porte médio",p:60},{n:"Banho - porte grande",p:85},{n:"Tosa higiênica",p:30},{n:"Tosa completa",p:70},{n:"Corte de unhas",p:15}],prod:p,nid:id+1}};
const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const brl=v=>v>0?v.toLocaleString("pt-BR",{style:"currency",currency:"BRL"}):"Consultar";
const val=n=>document.querySelector(`input[name="${n}"]:checked`).value;
const ci=c=>Math.max(0,CATS.findIndex(x=>x[0]==c));
const catOpts=sel=>CATS.map(x=>`<option ${x[0]==sel?"selected":""}>${esc(x[0])}</option>`).join("");
let S=DEF(),GH=null,dirty=false,cart={},q="",fc="",FOTOS={};
try{GH=JSON.parse(localStorage.getItem("petshop_gh"))}catch(e){}
const save=()=>{dirty=true;try{localStorage.setItem("petshop_draft",JSON.stringify(S))}catch(e){}};
const wa=t=>"https://wa.me/"+S.cfg.whats.replace(/\D/g,"")+(t?"?text="+encodeURIComponent(t):"");
const fix=()=>{S.cfg={...DEF().cfg,...S.cfg};S.nid=Math.max(S.nid||0,...S.prod.map(p=>p.id+1))};

function show(v){["loja","banho","admin"].forEach(x=>$(x).classList.toggle("esconder",x!=v));
document.querySelectorAll(".abas button").forEach(b=>b.classList.toggle("on",b.dataset.a==v));
$("barra").classList.toggle("esconder",v!="loja");if(v=="admin")admin();scrollTo(0,0)}
function head(){const c=S.cfg;$("nomeLoja").textContent="🐾 "+c.loja;document.title=c.loja+" | Pedido";$("pixChave").textContent=c.pix;
$("sub").innerHTML="Escolha os produtos e faça seu pedido pelo WhatsApp"+(c.hor?"<br>"+esc(c.hor):"")+(c.end?"<br>"+esc(c.end):"")}
function produtos(){const L=S.prod.filter(p=>(!fc||p.c==fc)&&p.n.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>a.n.localeCompare(b.n,"pt-BR"));
$("produtos").innerHTML=L.length?L.map(p=>`<div class="produto"><div class="foto"><span class="sem-foto">${ICON[ci(p.c)]}</span>${p.f?`<img loading="lazy" src="${esc(FOTOS[p.f]||p.f)}" alt="${esc(p.n)}" onerror="this.remove()">`:""}</div><div class="info"><div class="nome">${esc(p.n)}</div><div class="descricao">${esc(p.d)}</div><div class="preco">${brl(p.p)}</div><div class="quantidade"><button data-m="${p.id}" data-v="-1">−</button><span id="q${p.id}">${cart[p.id]||0}</span><button data-m="${p.id}" data-v="1">+</button></div></div></div>`).join(""):"<p>Nenhum produto encontrado.</p>"}
function servicos(){$("servicos").innerHTML=S.serv.map(s=>`<div class="serv"><span>${esc(s.n)}</span><b>${brl(s.p)}</b></div>`).join("");$("bS").innerHTML=S.serv.map(s=>`<option>${esc(s.n)}</option>`).join("")}
function calc(){let it=[],sub=0,n=0;S.prod.forEach(p=>{const k=cart[p.id];if(k>0){it.push({p,k});sub+=p.p*k;n+=k}});
const taxa=val("recebimento")=="Entrega"&&it.length?S.cfg.taxa:0;return{it,sub,n,taxa,total:sub+taxa}}
function resumo(){const o=calc();$("qtdTotal").textContent=o.n+(o.n==1?" item":" itens");$("valorTotal").textContent=o.total>0?brl(o.total):"R$ 0,00";$("enviar").disabled=!o.it.length}
function render(){head();produtos();servicos();resumo()}

function enviarPedido(){const nome=$("nome").value.trim(),tel=$("telefone").value.trim(),end=$("endereco").value.trim(),troco=$("troco").value.trim(),o=calc(),pg=val("pagamento"),ent=val("recebimento")=="Entrega";
let er=[];if(!nome)er.push("seu nome");if(!tel)er.push("seu WhatsApp");if(ent&&!end)er.push("seu endereço");
if(er.length){$("erro").textContent="Preencha: "+er.join(", ")+".";return}
if(pg=="Dinheiro"&&troco&&+troco<o.total){$("erro").textContent="O troco precisa ser maior ou igual ao total do pedido.";return}
$("erro").textContent="";const c=S.cfg;
let m=`🐾 *NOVO PEDIDO - ${c.loja}*\n\n👤 *Nome:* ${nome}\n📱 *WhatsApp:* ${tel}\n\n🛒 *PRODUTOS*\n\n`;
o.it.forEach(x=>{m+=`• ${x.k}x ${x.p.n}${x.p.d?" ("+x.p.d+")":""}\n  ${brl(x.p.p)} cada — ${x.p.p>0?brl(x.p.p*x.k):"a consultar"}\n\n`});
m+=`━━━━━━━━━━━━━━\nSubtotal: ${brl(o.sub)}\n`;if(o.taxa>0)m+=`🚚 Entrega: ${brl(o.taxa)}\n`;
m+=`*TOTAL: ${brl(o.total)}*\n\n💳 *Pagamento:* ${pg}\n`;
if(pg=="Pix")m+=`🔑 *Chave Pix:* ${c.pix}\n🏪 *Recebedor:* ${c.pixNome}\n📸 Após o pagamento, envie o comprovante por aqui.\n`;
if(pg=="Dinheiro"&&troco)m+=`💵 *Troco para:* R$ ${troco}\n`;
m+=ent?`\n🚚 *Entrega*\n📍 *Endereço:* ${end}\n`:`\n🏪 *Retirada na loja*\n`;
window.open(wa(m+"\nObrigado pelo pedido! 🐾"),"_blank")}
function enviarBanho(){const n=$("bN").value.trim(),p=$("bP").value.trim();if(!n||!p){$("bErro").textContent="Preencha seu nome e o nome do pet.";return}$("bErro").textContent="";
const d=$("bD").value?$("bD").value.split("-").reverse().join("/"):"a combinar";
window.open(wa(`🛁 *AGENDAMENTO - Banho e tosa*\n\n👤 *Tutor:* ${n}\n🐶 *Pet:* ${p}\n📏 *Raça/porte:* ${$("bR").value||"-"}\n✂️ *Serviço:* ${$("bS").value}\n📅 *Data:* ${d}\n⏰ *Horário:* ${$("bH").value||"a combinar"}`),"_blank")}

/* ---------- ÁREA DO LOJISTA ---------- */
const API=()=>`https://api.github.com/repos/${GH.u}/${GH.r}/contents/`,HD=()=>({Authorization:"Bearer "+GH.t,Accept:"application/vnd.github+json"});
function admin(){const A=$("admin"),c=S.cfg;
if(!GH){A.innerHTML=`<div class="card"><h2>Área do lojista</h2><p>Conecte ao GitHub uma só vez (veja o LEIA-ME). Os dados ficam só neste navegador.</p><label>Usuário do GitHub</label><input id="gU"><label>Nome do repositório</label><input id="gR"><label>Branch</label><input id="gB" value="main"><label>Token de acesso</label><input id="gT" type="password"><p><button class="btn azul" id="login">Conectar</button></p></div>`;return}
const f=(k,l,t="text")=>`<label>${l}</label><input type="${t}" data-cfg="${k}" value="${esc(c[k])}">`;
A.innerHTML=`<div class="card pubbar"><span>${dirty?"Há alterações não publicadas.":"Tudo publicado."}</span><button class="btn amarelo" id="pub">Publicar alterações</button></div>
<div class="card"><h2>Dados da loja</h2>${f("loja","Nome da loja")}${f("whats","WhatsApp (55 + DDD + número)")}${f("pix","Chave Pix")}${f("pixNome","Nome do recebedor do Pix")}${f("taxa","Taxa de entrega (R$)","number")}${f("hor","Horário de atendimento")}${f("end","Endereço da loja")}</div>
<div class="card"><h2>Banho e tosa</h2>${S.serv.map((s,i)=>`<div class="row2" style="margin-bottom:6px"><input style="flex:2" data-sn="${i}" value="${esc(s.n)}"><input style="flex:1" type="number" min="0" step="0.01" data-sp="${i}" value="${s.p}"><button class="btn red" style="padding:8px" data-sd="${i}">X</button></div>`).join("")}<button class="btn amarelo" id="sAdd">Novo serviço</button></div>
<div class="card"><h2>Produtos (${S.prod.length})</h2><p><button class="btn amarelo" id="pAdd">Novo produto</button></p><input id="aq" placeholder="Buscar produto para editar..."><div id="alist"></div></div>
<p style="text-align:center"><button class="btn azul" id="logout">Desconectar do GitHub</button></p>`;alist()}
function alist(){const t=($("aq")?$("aq").value:"").toLowerCase();
$("alist").innerHTML=S.prod.filter(p=>p.n.toLowerCase().includes(t)).map(p=>`<div class="ap"><div class="th">${p.f?`<img src="${esc(FOTOS[p.f]||p.f)}" onerror="this.remove()">`:"📷"}</div><div class="af"><input data-pn="${p.id}" value="${esc(p.n)}" placeholder="Nome"><input data-pdd="${p.id}" value="${esc(p.d)}" placeholder="Descrição (ex.: 10 kg)"><div class="row2"><input type="number" min="0" step="0.01" data-pp="${p.id}" value="${p.p}" placeholder="Preço"><select data-pc="${p.id}">${catOpts(p.c)}</select></div><div class="row2"><input type="file" accept="image/*" data-pf="${p.id}"><button class="btn amarelo" style="padding:8px;white-space:nowrap" data-ia="${p.id}">🤖 IA</button><button class="btn red" style="padding:8px" data-del="${p.id}">X</button></div></div></div>`).join("")}
async function gerarIA(id,b){const p=S.prod.find(x=>x.id==id);b.disabled=true;b.textContent="Gerando...";
try{const txt=`professional product photo of ${p.n}${p.d?", "+p.d:""}, pet shop product, centered, white background, studio lighting, no text`;
const r=await fetch("https://image.pollinations.ai/prompt/"+encodeURIComponent(txt)+"?width=700&height=700&nologo=true&seed="+Math.floor(Math.random()*1e6));
if(!r.ok)throw 0;await foto(id,await r.blob())}catch(e){alert("Não foi possível gerar a imagem agora. Tente de novo em instantes.");b.disabled=false;b.textContent="🤖 IA"}}
async function foto(id,file){if(!file)return;try{const img=await createImageBitmap(file),k=Math.min(1,700/Math.max(img.width,img.height)),cv=document.createElement("canvas");cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
const url=cv.toDataURL("image/jpeg",.8),path="fotos/p"+id+"-"+Date.now()+".jpg";
const r=await fetch(API()+path,{method:"PUT",headers:HD(),body:JSON.stringify({message:"Foto do produto",branch:GH.b,content:url.split(",")[1]})});if(!r.ok)throw 0;
FOTOS[path]=url;S.prod.find(p=>p.id==id).f=path;save();alist();produtos()}catch(e){alert("Não foi possível enviar a foto. Use uma imagem JPG ou PNG e confira o token.")}}
async function publish(b){b.disabled=true;b.textContent="Publicando...";const u=API()+"dados.json";
try{let sha;const g=await fetch(u+"?ref="+GH.b,{headers:HD()});if(g.ok)sha=(await g.json()).sha;
const body={message:"Atualização pelo painel",branch:GH.b,content:btoa(unescape(encodeURIComponent(JSON.stringify(S))))};if(sha)body.sha=sha;
const r=await fetch(u,{method:"PUT",headers:HD(),body:JSON.stringify(body)});if(!r.ok)throw 0;
dirty=false;try{localStorage.removeItem("petshop_draft")}catch(e){}alert("Publicado! Aparece no site em cerca de 1 minuto.")}catch(e){alert("Não foi possível publicar. Confira o token (Contents: Read and write).")}admin()}

/* ---------- EVENTOS ---------- */
document.addEventListener("click",e=>{const b=e.target.closest("button,a");if(!b)return;const d=b.dataset;
if(b.id=="abrirAdmin"){e.preventDefault();show("admin")}
else if(d.a)show(d.a)
else if(d.m){const id=d.m;cart[id]=Math.max(0,(cart[id]||0)+ +d.v);$("q"+id).textContent=cart[id];resumo()}
else if(b.id=="enviar")enviarPedido()
else if(b.id=="bSend")enviarBanho()
else if(b.id=="login"){const g={u:$("gU").value.trim(),r:$("gR").value.trim(),b:$("gB").value.trim()||"main",t:$("gT").value.trim()};if(!g.u||!g.r||!g.t){alert("Preencha todos os campos.");return}
fetch(`https://api.github.com/repos/${g.u}/${g.r}`,{headers:{Authorization:"Bearer "+g.t}}).then(r=>{if(!r.ok)throw 0;GH=g;try{localStorage.setItem("petshop_gh",JSON.stringify(g))}catch(e){}admin()}).catch(()=>alert("Não consegui conectar. Confira usuário, repositório e token."))}
else if(b.id=="logout"){GH=null;try{localStorage.removeItem("petshop_gh")}catch(e){}admin()}
else if(b.id=="pub")publish(b)
else if(d.ia)gerarIA(d.ia,b)
else if(b.id=="sAdd"){S.serv.push({n:"Novo serviço",p:0});save();admin();servicos()}
else if(d.sd){S.serv.splice(+d.sd,1);save();admin();servicos()}
else if(b.id=="pAdd"){S.prod.unshift({id:S.nid++,n:"Novo produto",d:"",p:0,c:CATS[0][0],f:""});save();alist();produtos()}
else if(d.del){if(confirm("Excluir este produto?")){S.prod=S.prod.filter(p=>p.id!=d.del);save();alist();produtos()}}});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;
if(t.name=="recebimento"){$("enderecoArea").classList.toggle("esconder",t.value!="Entrega");resumo()}
else if(t.name=="pagamento"){$("trocoArea").classList.toggle("esconder",t.value!="Dinheiro");$("pixArea").classList.toggle("esconder",t.value!="Pix")}
else if(t.id=="cat"){fc=t.value;produtos()}
else if(d.pf)foto(d.pf,t.files[0])});
document.addEventListener("input",e=>{const t=e.target,d=t.dataset,P=id=>S.prod.find(p=>p.id==id);
if(t.id=="busca"){q=t.value;produtos();return}
if(t.id=="aq"){alist();return}
if(d.cfg)S.cfg[d.cfg]=d.cfg=="taxa"?+t.value||0:t.value;
else if(d.sn!==undefined)S.serv[d.sn].n=t.value;
else if(d.sp!==undefined)S.serv[d.sp].p=+t.value||0;
else if(d.pn)P(d.pn).n=t.value;
else if(d.pdd)P(d.pdd).d=t.value;
else if(d.pp)P(d.pp).p=+t.value||0;
else if(d.pc)P(d.pc).c=t.value;
else return;
save();head();produtos();servicos();resumo()});

$("cat").innerHTML='<option value="">Todas as categorias</option>'+CATS.map(x=>`<option>${esc(x[0])}</option>`).join("");
render();
fetch("dados.json?v="+Date.now()).then(r=>r.ok?r.json():null).then(d=>{if(d&&d.prod){S=d;fix()}
if(GH){try{const dr=JSON.parse(localStorage.getItem("petshop_draft"));if(dr&&dr.prod){S=dr;fix();dirty=true}}catch(e){}}
render()}).catch(()=>{});
</script>
</body>
</html>
